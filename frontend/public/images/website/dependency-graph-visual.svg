<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="#302326" stroke="#62464A" stroke-width="2"/>
  
  <!-- Subtle Gradient Glow -->
  <defs>
    <linearGradient id="dep-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#354854" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#302326" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#dep-grad)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#790D16"/>
  <circle cx="44" cy="21" r="5" fill="#E5D3AF"/>
  <circle cx="60" cy="21" r="5" fill="#AEC4D4"/>
  <text x="84" y="25" font-family="monospace" font-size="11" font-weight="600" fill="#D4C3BB">DEPENDENCY_MAP // CROSS_TEAM_BLAST_RADIUS</text>

  <!-- Interactive Graph Canvas Mock -->
  <rect x="24" y="60" width="752" height="300" rx="12" fill="#403034" stroke="#62464A" stroke-width="1"/>
  
  <!-- Connecting Arcs/Lines -->
  <path d="M 160 210 C 240 130, 320 130, 400 130" stroke="#E5D3AF" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 160 210 C 240 280, 320 280, 400 280" stroke="#790D16" stroke-width="3"/>
  <path d="M 400 130 C 480 130, 560 170, 640 200" stroke="#AEC4D4" stroke-width="2"/>
  <path d="M 400 280 C 480 280, 560 230, 640 200" stroke="#790D16" stroke-width="3"/>

  <!-- Node 1: Root Auth Gateway -->
  <rect x="70" y="180" width="180" height="60" rx="10" fill="#49363A" stroke="#790D16" stroke-width="2"/>
  <text x="86" y="204" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5EFE1">Auth API Gateway</text>
  <text x="86" y="224" font-family="monospace" font-size="10" fill="#E5D3AF">PR #142 (Merged)</text>

  <!-- Node 2: Upstream Billing Contract -->
  <rect x="320" y="100" width="180" height="60" rx="10" fill="#49363A" stroke="#AEC4D4" stroke-width="1.5"/>
  <text x="336" y="124" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5EFE1">Billing Service</text>
  <text x="336" y="144" font-family="monospace" font-size="10" fill="#AEC4D4">v2.1 Schema Unblocked</text>

  <!-- Node 3: Downstream Client SDK (Critical Path) -->
  <rect x="320" y="250" width="180" height="60" rx="10" fill="#790D16" fill-opacity="0.3" stroke="#790D16" stroke-width="2"/>
  <text x="336" y="274" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5EFE1">Client SDK Token</text>
  <text x="336" y="294" font-family="monospace" font-size="10" fill="#E5D3AF">CRITICAL PATH · IN REVIEW</text>

  <!-- Node 4: End Consumer Web App -->
  <rect x="560" y="170" width="180" height="60" rx="10" fill="#49363A" stroke="#62464A" stroke-width="1.5"/>
  <text x="576" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5EFE1">Web App Session</text>
  <text x="576" y="214" font-family="monospace" font-size="10" fill="#D4C3BB">ETA: Fri Cutoff On Schedule</text>

  <!-- Bottom Floating Placeholder Label -->
  <rect x="24" y="380" width="752" height="96" rx="12" fill="#403034" stroke="#E5D3AF" stroke-width="1.5"/>
  <circle cx="64" cy="428" r="20" fill="#790D16"/>
  <path d="M 58 424 L 62 420 H 66 L 70 424 H 74 C 75 424 76 425 76 426 V 434 C 76 435 75 436 74 436 H 54 C 53 436 52 435 52 434 V 426 C 52 425 53 424 54 424 Z" fill="#F5EFE1"/>
  <circle cx="64" cy="430" r="3" fill="#790D16"/>
  <text x="96" y="420" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5EFE1">
    PLACEHOLDER: dependency-graph-visual.svg
  </text>
  <text x="96" y="438" font-family="monospace" font-size="11" fill="#E5D3AF">
    public/images/website/dependency-graph-visual.svg • 800 x 500 px
  </text>
  <text x="96" y="456" font-family="system-ui, sans-serif" font-size="10" fill="#D4C3BB">
    Shows cross-service architecture dependencies, PR blockers, and real-time blast radius calculations.
  </text>
</svg>
