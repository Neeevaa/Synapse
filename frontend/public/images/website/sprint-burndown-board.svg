<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="#302326" stroke="#62464A" stroke-width="2"/>
  
  <!-- Subtle Gradient Glow -->
  <defs>
    <linearGradient id="sprint-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#790D16" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#302326" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#sprint-grad)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#790D16"/>
  <circle cx="44" cy="21" r="5" fill="#E5D3AF"/>
  <circle cx="60" cy="21" r="5" fill="#AEC4D4"/>
  <text x="84" y="25" font-family="monospace" font-size="11" font-weight="600" fill="#D4C3BB">SPRINT_24 // BURNDOWN &amp; VELOCITY MONITOR</text>

  <!-- Left: Velocity Chart Mock -->
  <rect x="24" y="60" width="460" height="300" rx="12" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <text x="44" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E5D3AF" letter-spacing="1">IDEAL VS ACTUAL BURN-DOWN</text>
  
  <!-- Chart Axes & Grid -->
  <line x1="50" y1="120" x2="450" y2="120" stroke="#62464A" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="50" y1="180" x2="450" y2="180" stroke="#62464A" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="50" y1="240" x2="450" y2="240" stroke="#62464A" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="50" y1="300" x2="450" y2="300" stroke="#62464A" stroke-width="1"/>

  <!-- Guideline & Actual line -->
  <path d="M 50 120 L 450 300" stroke="#D4C3BB" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.5"/>
  <path d="M 50 120 L 130 150 L 210 170 L 290 230 L 370 260" stroke="#790D16" stroke-width="3" fill="none"/>
  <circle cx="370" cy="260" r="5" fill="#E5D3AF" stroke="#790D16" stroke-width="2"/>
  <text x="382" y="264" font-family="monospace" font-size="10" font-weight="700" fill="#F5EFE1">Day 8: -4 pts ahead</text>

  <!-- Right: Team Capacity Breakdown -->
  <rect x="500" y="60" width="276" height="300" rx="12" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <text x="520" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E5D3AF" letter-spacing="1">TEAM CAPACITY</text>

  <rect x="520" y="110" width="236" height="60" rx="8" fill="#49363A" stroke="#62464A" stroke-width="1"/>
  <text x="532" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F5EFE1">Platform Core (3 devs)</text>
  <rect x="532" y="142" width="212" height="6" rx="3" fill="#62464A"/>
  <rect x="532" y="142" width="180" height="6" rx="3" fill="#790D16"/>
  <text x="532" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#D4C3BB">Allocated: 24 / 28 pts (85%)</text>

  <rect x="520" y="180" width="236" height="60" rx="8" fill="#49363A" stroke="#62464A" stroke-width="1"/>
  <text x="532" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F5EFE1">Frontend &amp; UX (2 devs)</text>
  <rect x="532" y="212" width="212" height="6" rx="3" fill="#62464A"/>
  <rect x="532" y="212" width="160" height="6" rx="3" fill="#AEC4D4"/>
  <text x="532" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#D4C3BB">Allocated: 16 / 20 pts (80%)</text>

  <rect x="520" y="250" width="236" height="60" rx="8" fill="#49363A" stroke="#62464A" stroke-width="1"/>
  <text x="532" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F5EFE1">QA Automation (1 dev)</text>
  <rect x="532" y="282" width="212" height="6" rx="3" fill="#62464A"/>
  <rect x="532" y="282" width="190" height="6" rx="3" fill="#E5D3AF"/>
  <text x="532" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#D4C3BB">Allocated: 8 / 10 pts (80%)</text>

  <!-- Bottom Floating Placeholder Label -->
  <rect x="24" y="380" width="752" height="96" rx="12" fill="#403034" stroke="#E5D3AF" stroke-width="1.5"/>
  <circle cx="64" cy="428" r="20" fill="#790D16"/>
  <path d="M 58 424 L 62 420 H 66 L 70 424 H 74 C 75 424 76 425 76 426 V 434 C 76 435 75 436 74 436 H 54 C 53 436 52 435 52 434 V 426 C 52 425 53 424 54 424 Z" fill="#F5EFE1"/>
  <circle cx="64" cy="430" r="3" fill="#790D16"/>
  <text x="96" y="420" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5EFE1">
    PLACEHOLDER: sprint-burndown-board.svg
  </text>
  <text x="96" y="438" font-family="monospace" font-size="11" fill="#E5D3AF">
    public/images/website/sprint-burndown-board.svg • 800 x 500 px
  </text>
  <text x="96" y="456" font-family="system-ui, sans-serif" font-size="10" fill="#D4C3BB">
    Shows real-time sprint burn-down trajectory, capacity balance, and team delivery velocity.
  </text>
</svg>
