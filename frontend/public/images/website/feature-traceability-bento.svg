<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="#302326" stroke="#62464A" stroke-width="2"/>
  
  <!-- Subtle Gradient Glow -->
  <defs>
    <linearGradient id="trace-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5D3AF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#790D16" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#trace-grad)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#790D16"/>
  <circle cx="44" cy="21" r="5" fill="#E5D3AF"/>
  <circle cx="60" cy="21" r="5" fill="#AEC4D4"/>
  <text x="84" y="25" font-family="monospace" font-size="11" font-weight="600" fill="#D4C3BB">END_TO_END_TRACEABILITY // SPEC_TO_PRODUCTION</text>

  <!-- Bento 3 Column Flow Mock -->
  <!-- Col 1: Requirement -->
  <rect x="24" y="60" width="236" height="300" rx="12" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <text x="40" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E5D3AF" letter-spacing="1">1. LIVING SPEC</text>
  <rect x="36" y="104" width="212" height="70" rx="8" fill="#49363A" stroke="#62464A" stroke-width="1"/>
  <text x="48" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5EFE1">PRD-2026: Auth Refresh</text>
  <text x="48" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#AEC4D4">14 ACs · Automated Tests linked</text>
  <text x="40" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#D4C3BB">Status: Approved by PM</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 268 210 L 286 210" stroke="#790D16" stroke-width="3"/>

  <!-- Col 2: Task & Code Commit -->
  <rect x="294" y="60" width="236" height="300" rx="12" fill="#403034" stroke="#790D16" stroke-width="1.5"/>
  <text x="310" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E5D3AF" letter-spacing="1">2. PULL REQUEST</text>
  <rect x="306" y="104" width="212" height="70" rx="8" fill="#49363A" stroke="#790D16" stroke-width="1"/>
  <text x="318" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5EFE1">PR #142 · Schema Token</text>
  <text x="318" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#E5D3AF">CI Passing · 100% AC Coverage</text>
  <text x="310" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#D4C3BB">Merged into staging</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 538 210 L 556 210" stroke="#790D16" stroke-width="3"/>

  <!-- Col 3: Verified Release -->
  <rect x="564" y="60" width="212" height="300" rx="12" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <text x="580" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E5D3AF" letter-spacing="1">3. PRODUCTION</text>
  <rect x="576" y="104" width="188" height="70" rx="8" fill="#354854" stroke="#AEC4D4" stroke-opacity="0.5" stroke-width="1"/>
  <text x="588" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5EFE1">Release v2.4.0</text>
  <text x="588" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#AEC4D4">Zero Rollback Delta</text>
  <text x="580" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#D4C3BB">Audit Trail Archived</text>

  <!-- Bottom Floating Placeholder Label -->
  <rect x="24" y="380" width="752" height="96" rx="12" fill="#403034" stroke="#E5D3AF" stroke-width="1.5"/>
  <circle cx="64" cy="428" r="20" fill="#790D16"/>
  <path d="M 58 424 L 62 420 H 66 L 70 424 H 74 C 75 424 76 425 76 426 V 434 C 76 435 75 436 74 436 H 54 C 53 436 52 435 52 434 V 426 C 52 425 53 424 54 424 Z" fill="#F5EFE1"/>
  <circle cx="64" cy="430" r="3" fill="#790D16"/>
  <text x="96" y="420" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5EFE1">
    PLACEHOLDER: feature-traceability-bento.svg
  </text>
  <text x="96" y="438" font-family="monospace" font-size="11" fill="#E5D3AF">
    public/images/website/feature-traceability-bento.svg • 800 x 500 px
  </text>
  <text x="96" y="456" font-family="system-ui, sans-serif" font-size="10" fill="#D4C3BB">
    Shows unbroken audit trail from PRD acceptance criteria to git pull requests and verified production delivery.
  </text>
</svg>
