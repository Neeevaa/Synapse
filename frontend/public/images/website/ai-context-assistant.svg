  </text>
  <text x="44" y="260" font-family="system-ui, sans-serif" font-size="12" fill="#D4C3BB">
    2. Cascade Impact: Delay beyond Thursday pushes release cutoff from Friday to Monday (+3 days).
  </text>
  <text x="44" y="282" font-family="system-ui, sans-serif" font-size="12" fill="#D4C3BB">
    3. Suggested Action: Reassign secondary reviewer @neeva to unblock approval queue within 4 hours.
  </text>

  <!-- Source Citations Pills -->
  <rect x="44" y="310" width="170" height="26" rx="6" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <text x="54" y="327" font-family="monospace" font-size="10" fill="#AEC4D4">PR #142 (auth-session)</text>
  <rect x="226" y="310" width="160" height="26" rx="6" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <text x="236" y="327" font-family="monospace" font-size="10" fill="#AEC4D4">Jira: SYN-418 (Billing)</text>
  <rect x="398" y="310" width="180" height="26" rx="6" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <text x="408" y="327" font-family="monospace" font-size="10" fill="#AEC4D4">Slack: #arch-decisions (14m ago)</text>

  <!-- Bottom Floating Placeholder Label -->
  <rect x="24" y="380" width="752" height="96" rx="12" fill="#403034" stroke="#E5D3AF" stroke-width="1.5"/>
  <circle cx="64" cy="428" r="20" fill="#790D16"/>
  <path d="M 58 424 L 62 420 H 66 L 70 424 H 74 C 75 424 76 425 76 426 V 434 C 76 435 75 436 74 436 H 54 C 53 436 52 435 52 434 V 426 C 52 425 53 424 54 424 Z" fill="#F5EFE1"/>
  <circle cx="64" cy="430" r="3" fill="#790D16"/>
  <text x="96" y="420" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5EFE1">
