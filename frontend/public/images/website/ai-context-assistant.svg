<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="#302326" stroke="#62464A" stroke-width="2"/>
  
  <!-- Subtle Gradient Glow -->
  <defs>
    <linearGradient id="ai-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#790D16" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#354854" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#ai-grad)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <circle cx="28" cy="21" r="5" fill="#790D16"/>
  <circle cx="44" cy="21" r="5" fill="#E5D3AF"/>
  <circle cx="60" cy="21" r="5" fill="#AEC4D4"/>
  <text x="84" y="25" font-family="monospace" font-size="11" font-weight="600" fill="#D4C3BB">SYNAPSE_AI // CONTEXTUAL_PROJECT_INTELLIGENCE</text>

  <!-- Query Box Mock -->
  <rect x="24" y="60" width="752" height="74" rx="12" fill="#403034" stroke="#62464A" stroke-width="1"/>
  <text x="44" y="86" font-family="monospace" font-size="10" font-weight="700" fill="#AEC4D4">NATURAL LANGUAGE PROJECT QUERY</text>
  <text x="44" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#F5EFE1">
    &quot;What is the delay risk if PR #142 auth token schema changes slip past Thursday?&quot;
  </text>

  <!-- Synthesized AI Answer Mock -->
  <rect x="24" y="148" width="752" height="212" rx="12" fill="#354854" stroke="#AEC4D4" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="44" y="166" width="130" height="22" rx="11" fill="#790D16" fill-opacity="0.8"/>
  <text x="109" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#F5EFE1">AI COGNITIVE SYNTHESIS</text>

  <text x="44" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#F5EFE1">
    Based on commit history, PR dependencies, and Sprint 24 burndown:
  </text>
  <text x="44" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#E5D3AF">
